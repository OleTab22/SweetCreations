<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sweet Creations - Cart</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/cart.css">
</head>
<body>
    <header>
        <div class="container">
            <h1 class="sweet-creations">Sweet Creations</h1>
            <nav class="site-nav">
                <ul class="home-parent">
                    <li><a href="index.html" class="nav-link">Home</a></li>
                    <li><a href="catalog.html" class="nav-link">Catalog</a></li>
                    <li><a href="cart.html" class="nav-link">Cart</a></li>
                    <li><a href="wishlist.html" class="nav-link">Wishlist</a></li>
                    <li><a href="contact.html" class="nav-link">Contact</a></li>
                    <li><a href="login.html" class="nav-link login">Login</a></li>
                    <li><a href="register.html" class="nav-link signup">Sign Up</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="cart">
        <div class="cart-container">
            <h2>Your Cart</h2>
            <div class="cart-list">
                <!-- Dynamic cart items rendered by JS -->
            </div>
            <div class="total-cost">Total: <span id="total-cost">R0.00</span></div>
            <button class="checkout-btn">Proceed to Checkout</button>
        </div>

        <!-- Checkout Form -->
        <section class="checkout-form" style="display: none;">
            <h3>Checkout</h3>
            <form onsubmit="processCheckout(); return false;">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>

                <label for="address">Address:</label>
                <input type="text" id="address" name="address" required>

                <label for="payment">Payment Information:</label>
                <input type="text" id="payment" name="payment" required>

                <button type="submit" class="button-primary">Place Order</button>
            </form>
        </section>
    </main>

    <footer class="site-footer">
        <div class="footer-content">
            <p>&copy; 2024 Sweet Creations. All rights reserved.</p>
        </div>
    </footer>

    <script type="module" src="js/cart.js"></script>
</body>
</html>
