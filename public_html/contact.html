<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sweet Creations - Contact</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <div class="container">
            <h1 class="sweet-creations">Sweet Creations</h1>
            <nav class="site-nav">
                <ul class="home-parent">
                    <li><a href="index.html" class="nav-link">Home</a></li>
                    <li><a href="catalog.html" class="nav-link">Catalog</a></li>
                    <li><a href="cart.html" class="nav-link">Cart</a></li>
                    <li><a href="wishlist.html" class="nav-link">Wishlist</a></li>
                    <li><a href="contact.html" class="nav-link">Contact</a></li>
                    <li><a href="login.html" class="nav-link login">Login</a></li>
                    <li><a href="register.html" class="nav-link signup">Sign Up</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <h2>Contact Us</h2>
        <form id="contact-form">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="message">Message:</label>
            <textarea id="message" name="message" required></textarea>

            <button type="submit" class="button-primary">Send Message</button>
        </form>
    </main>

    <footer class="site-footer">
        <div class="footer-content">
            <p>&copy; 2024 Sweet Creations. All rights reserved.</p>
        </div>
    </footer>

    <script type="module" src="js/firestore.js"></script>
</body>
</html>
