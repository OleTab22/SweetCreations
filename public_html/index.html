<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sweet Creations - Home</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <div class="container">
            <div class="header-content">
                <h1 class="sweet-creations">Sweet Creations</h1>
                <div class="header-right">
                    <div id="user-profile"></div>
                    <nav class="site-nav">
                        <ul class="home-parent">
                            <!-- Dynamically populated by script.js -->
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </header>

    <main>
        <section class="hero">
            <div class="hero-content">
                <h1>Welcome to Sweet Creations</h1>
                <p>Your one-stop shop for delicious treats!</p>
                <a href="catalog.html" class="button-primary">Shop Now</a>
            </div>
        </section>
        <section class="featured-products">
            <h2>Featured Products</h2>
            <div class="product-list">
                <!-- Products will be dynamically inserted here -->
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="footer-content">
            <p>&copy; 2024 Sweet Creations. All rights reserved.</p>
        </div>
    </footer>

    <script type="module" src="js/script.js"></script>
</body>
</html>
