<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Sweet Creations</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">
    <header class="admin-header">
        <div class="container">
            <div class="header-content">
                <h1 class="sweet-creations">Admin Dashboard</h1>
                <div class="header-right">
                    <div id="user-profile"></div>
                </div>
            </div>
        </div>
    </header>

    <div class="admin-layout">
        <nav class="admin-sidebar">
            <ul class="admin-nav">
                <li><a href="dashboard.html" class="active">Dashboard</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="orders.html">Orders</a></li>
                <li><a href="users.html">Users</a></li>
                <li><a href="settings.html">Settings</a></li>
            </ul>
        </nav>

        <main class="admin-main">
            <div class="admin-header">
                <h2>Dashboard Overview</h2>
            </div>

            <div class="dashboard-grid">
                <div class="dashboard-card">
                    <h3>Total Orders</h3>
                    <p class="dashboard-number" id="total-orders">0</p>
                </div>
                <div class="dashboard-card">
                    <h3>Total Products</h3>
                    <p class="dashboard-number" id="total-products">0</p>
                </div>
                <div class="dashboard-card">
                    <h3>Total Users</h3>
                    <p class="dashboard-number" id="total-users">0</p>
                </div>
                <div class="dashboard-card">
                    <h3>Revenue</h3>
                    <p class="dashboard-number" id="total-revenue">$0</p>
                </div>
            </div>

            <div class="dashboard-sections">
                <section class="recent-orders">
                    <h3>Recent Orders</h3>
                    <div class="table-responsive">
                        <table class="admin-table">
                            <thead>
                                <tr>
                                    <th>Order ID</th>
                                    <th>Customer</th>
                                    <th>Date</th>
                                    <th>Status</th>
                                    <th>Amount</th>
                                </tr>
                            </thead>
                            <tbody id="recent-orders-table">
                                <!-- Dynamically populated -->
                            </tbody>
                        </table>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <script type="module" src="../js/admin/dashboard.js"></script>
</body>
</html>
