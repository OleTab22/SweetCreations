<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sweet Creations</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <div class="container">
            <h1 class="sweet-creations">Sweet Creations</h1>
            <nav class="site-nav">
                <ul class="home-parent">
                    <li><a href="index.html" class="nav-link">Home</a></li>
                    <li><a href="catalog.html" class="nav-link">Catalog</a></li>
                    <li><a href="cart.html" class="nav-link">Cart</a></li>
                    <li><a href="wishlist.html" class="nav-link">Wishlist</a></li>
                    <li><a href="contact.html" class="nav-link">Contact</a></li>
                    <li><a href="login.html" class="nav-link active">Login</a></li>
                    <li><a href="register.html" class="nav-link signup">Sign Up</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main class="auth-container">
        <div class="auth-card">
            <h1>Login</h1>
            <div id="error-message" class="error-message"></div>
            <form id="loginForm">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>

                <button type="submit" class="btn-primary">
                    <span class="btn-text">Login</span>
                    <div class="loader" style="display: none;"></div>
                </button>
            </form>
        </div>
    </main>
    <script type="module" src="js/auth.js"></script>
</body>
</html>
